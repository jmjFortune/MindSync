name: mindsync
services:
  mindsync:
    build: .
    image: mindsync
    restart: unless-stopped
    environment:
      MINDSYNC_ADMIN_TOKEN: ${MINDSYNC_ADMIN_TOKEN:?Set a strong admin token of at least 32 characters}
      MINDSYNC_DATA: /data
      MINDSYNC_PORT: "8080"
      MINDSYNC_MAX_FILE_BYTES: ${MINDSYNC_MAX_FILE_BYTES:-52428800}
      DATABASE_URL: postgresql://mindsync:${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}@postgres:5432/mindsync
    ports:
      - "${MINDSYNC_BIND_ADDRESS:-127.0.0.1}:${MINDSYNC_PORT:-8080}:8080"
    volumes:
      # Named volume inherits image UID 10001 ownership. For a bind mount,
      # create its source directory first and chown it to 10001:10001.
      - sync_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindsync
      POSTGRES_USER: mindsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsync -d mindsync"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sync_data:
  postgres_data:
